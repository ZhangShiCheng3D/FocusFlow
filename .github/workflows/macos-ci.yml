name: macOS CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test SwiftPM package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build debug
        run: swift build -c debug --package-path FocusFlow

      - name: Run tests
        run: swift test --package-path FocusFlow

  app-artifact:
    name: Package macOS app
    runs-on: macos-15
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        run: bash scripts/package_app.sh

      - name: Upload app bundle zip
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-macOS-app
          path: dist/FocusFlow.app.zip
          if-no-files-found: error
