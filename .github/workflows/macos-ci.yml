name: macOS CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test SwiftPM package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build debug
        run: swift build -c debug --package-path FocusFlow

      - name: Run tests
        run: swift test --package-path FocusFlow

  xcode-app-build:
    name: Verify Xcode app target builds
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app target (unsigned)
        run: |
          xcodebuild build \
            -project FocusFlow.xcodeproj \
            -scheme FocusFlow \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || \
          xcodebuild build \
            -project FocusFlow.xcodeproj \
            -scheme FocusFlow \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  app-artifact:
    name: Package macOS app
    runs-on: macos-15
    needs: build-and-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        run: bash scripts/package_app.sh

      - name: Upload app bundle zip
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-macOS-app
          path: dist/FocusFlow.app.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: app-artifact
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: FocusFlow-macOS-app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: FocusFlow.app.zip
          draft: false
          prerelease: false
          generate_release_notes: true
