name: Submit to App Store

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect?'
        type: boolean
        default: false
  push:
    tags: ['appstore-v*']

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug
        run: swift build -c debug --package-path FocusFlow

      - name: Run tests
        run: swift test --package-path FocusFlow

  submit-app-store:
    name: Submit to App Store Connect
    runs-on: macos-15
    needs: build-and-test
    environment: app-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERTIFICATE_PATH" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH/FocusFlow_AppStore.mobileprovision"

      - name: Archive and export
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/appstore_api_key.p8
        run: |
          # Write API key (secret read from env, not inlined into the script)
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$APP_STORE_CONNECT_API_KEY_PATH"
          chmod 600 "$APP_STORE_CONNECT_API_KEY_PATH"

          UPLOAD_FLAG=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.upload }}" = "true" ]; then
            UPLOAD_FLAG=""
          else
            UPLOAD_FLAG="--no-upload"
          fi

          bash scripts/submit_app_store.sh $UPLOAD_FLAG

      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-AppStore-Export
          path: build/app-store-export/
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain
