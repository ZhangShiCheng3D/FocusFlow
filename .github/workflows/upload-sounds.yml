name: Upload Sound Assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags: ['sounds-v*']

jobs:
  generate-and-upload:
    name: Generate and upload sound assets
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sound files (ffmpeg)
        run: bash scripts/ci_generate_sounds.sh

      - name: Create/Update Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "FocusFlow Sound Assets"
          body: "Ambient sound files for FocusFlow app. Total 24 .aac files."
          tag_name: sounds-v1
          draft: false
          prerelease: false
          files: sounds-out/*.aac
          make_latest: false
