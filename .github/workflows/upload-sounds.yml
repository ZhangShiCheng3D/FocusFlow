name: Upload Sound Assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags: ['sounds-v*']

jobs:
  generate-and-upload:
    name: Generate and upload sound assets
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Generate sound files
        run: bash scripts/ci_generate_sounds.sh

      - name: Create/Update Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "FocusFlow Sound Assets"
          body: "Ambient sound files for FocusFlow app. Total 24 .aac files."
          # Follow the pushed tag (e.g. sounds-v2) so each tag publishes its own
          # release; falls back to sounds-v1 for manual workflow_dispatch runs.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'sounds-v1' }}
          draft: false
          prerelease: false
          files: sounds-out/*.aac
          make_latest: false
